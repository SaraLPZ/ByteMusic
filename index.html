<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reproductor de musica</title>
    <link rel="stylesheet" href="style/style.css" />
    <link
      rel="shortcut icon"
      href="img/file-music-fill.svg"
      type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.4/lottie.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  </head>
  <body>
    <!-- NAV LATERAL -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <h4>BM</h4>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-title">MENÚ</span>

        <a href="#" class="sidebar-item">
          <i class="bi bi-house"></i>
          <span>Inicio</span>
        </a>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-playlist-header">
          <span class="sidebar-title">PLAYLISTS</span>

          <button id="crear-playlist" type="button">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>

        <div id="lista-playlists">
          <a href="#" class="sidebar-item">
            <i class="bi bi-music-note-list"></i>
            <span>Mi playlist</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="content">
      <!-- Tarjeta de éxito -->
      <div
        id="tarjetaExito"
        class="card-container bg-color-primary"
        style="display: none">
        <div class="alert" style="max-width: 18rem">
          <i class="bi bi-check-circle"></i>
          <div class="card-header d-flex justify-content-center"></div>
          <div class="card-body justify-content-center mx-auto text-center">
            <p class="card-title">
              Las canciones se han descargado correctamente
            </p>
          </div>
          <div class="card-button d-flex justify-content-center">
            <button
              type="button"
              class="btn btn-primary px-5 mt-4 rounded-5 fs-5"
              onclick="cerrarTarjeta()">
              Continuar
            </button>
          </div>
        </div>
      </div>

      <!-- CABECERA DE LA PLAYLIST -->
      <header class="pl-hero">
        <img
          class="pl-cover"
          src="https://img.freepik.com/fotos-premium/chica-anime-escuchando-musica-noche-lofi-triste_911078-5774.jpg"
          alt="Portada de la playlist" />

        <div class="pl-info">
          <span class="pl-label">PLAYLIST</span>
          <h1 class="pl-name" id="pl-nombre">Mi playlist</h1>
          <p class="pl-meta">
            <strong>Sara López</strong>
            <span class="pl-dot"></span>
            <span id="pl-total">0 canciones</span>
          </p>

          <div class="pl-actions">
            <button type="button" class="pl-btn-play" id="pl-reproducir">
              <i class="bi bi-play-fill"></i>
              Reproducir
            </button>

            <button
              type="button"
              class="pl-btn-ghost"
              id="pl-aleatorio"
              aria-label="Aleatorio">
              <i class="bi bi-shuffle"></i>
            </button>

            <label for="musica-input" class="pl-btn-add">
              <i class="bi bi-plus-lg"></i>
              Añadir canciones
            </label>
            <input
              id="musica-input"
              type="file"
              multiple
              hidden
              accept="audio/mpeg, audio/wav, audio/mp3, audio/ogg, audio/aac" />
          </div>
        </div>
      </header>

      <!-- LISTA + REPRODUCTOR -->
      <section id="reproductor-musica">
        <div class="playlist">
          <ul id="playlist-container">
            <li id="playlist-vacia">
              Todavía no has añadido nada a la playlist
            </li>
          </ul>
        </div>

        <!-- Nombre canción y artista -->
        <div id="contenedorNombreAll">
          <div id="contenedorImgTitle">
            <img
              src="https://img.freepik.com/fotos-premium/chica-anime-escuchando-musica-noche-lofi-triste_911078-5774.jpg"
              alt="imagen de la cancion" />
            <div id="titulo-artista">
              <div class="titulo-container">
                <h6 id="titulo-cancion">Titulo</h6>
              </div>
              <div id="nombre">Nombre</div>
            </div>
          </div>

          <div id="lopez">
            <audio src="" id="cancion">
              <source src="" type="audio/mpeg" />
              <source src="" type="audio/wav" />
            </audio>

            <div id="contenedorRango">
              <input type="range" value="0" id="progreso" />
            </div>

            <div id="contenedorControles">
              <div id="minutos"></div>

              <div id="cotenedorVolumen">
                <i class="bi bi-volume-down-fill fs-4"></i>
                <input
                  type="range"
                  id="control-volumen"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1" />
              </div>

              <div id="contenedorBotones">
                <i class="bi bi-shuffle iconoAleatorio aleatorio control"></i>
                <i class="bi bi-rewind atras control"></i>
                <i
                  class="bi bi-play-circle-fill iconoControl boton-reproducir-pausar"></i>
                <i class="bi bi-fast-forward adelante control"></i>
                <i class="bi bi-repeat iconoRepetir repetir control"></i>
              </div>
            </div>
          </div>
        </div>
      </section>
      <br />
    </div>

    <!-- MODAL PARA CREAR PLAYLIST -->
    <div
      class="modal fade"
      id="modalCrearPlaylist"
      tabindex="-1"
      aria-labelledby="tituloModalPlaylist"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-playlist">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalPlaylist">Nueva playlist</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Cerrar"></button>
          </div>

          <form id="formCrearPlaylist">
            <div class="modal-body">
              <input
                type="text"
                class="form-control input-playlist"
                id="nombrePlaylist"
                placeholder="Ej. Música favorita"
                maxlength="50"
                required
                autocomplete="off" />

              <div
                id="errorNombrePlaylist"
                class="error-playlist"
                role="alert"></div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-cancelar-playlist"
                data-bs-dismiss="modal">
                Cancelar
              </button>

              <button type="submit" class="btn btn-crear-playlist">
                <i class="bi bi-plus-lg"></i>
                Crear playlist
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
